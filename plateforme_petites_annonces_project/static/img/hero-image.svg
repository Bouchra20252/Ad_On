<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="400" fill="#f8f9fa" />
  
  <!-- Marketplace elements -->
  <g transform="translate(100, 50)">
    <!-- Storefront -->
    <rect x="50" y="100" width="300" height="200" fill="#ffffff" stroke="#3f51b5" stroke-width="3" />
    <rect x="50" y="80" width="300" height="20" fill="#3f51b5" />
    <polygon points="30,100 370,100 350,50 50,50" fill="#5c6bc0" />
    
    <!-- Door -->
    <rect x="175" y="200" width="50" height="100" fill="#f5f5f5" stroke="#3f51b5" stroke-width="1" />
    <circle cx="215" cy="250" r="5" fill="#3f51b5" />
    
    <!-- Windows -->
    <rect x="80" y="130" width="60" height="60" fill="#e3f2fd" stroke="#3f51b5" stroke-width="1" />
    <rect x="260" y="130" width="60" height="60" fill="#e3f2fd" stroke="#3f51b5" stroke-width="1" />
    <line x1="80" y1="160" x2="140" y2="160" stroke="#3f51b5" stroke-width="1" />
    <line x1="110" y1="130" x2="110" y2="190" stroke="#3f51b5" stroke-width="1" />
    <line x1="260" y1="160" x2="320" y2="160" stroke="#3f51b5" stroke-width="1" />
    <line x1="290" y1="130" x2="290" y2="190" stroke="#3f51b5" stroke-width="1" />
    
    <!-- Sign -->
    <rect x="125" y="20" width="150" height="40" fill="#ffffff" stroke="#3f51b5" stroke-width="2" rx="5" />
    <text x="200" y="45" font-family="Arial" font-size="18" fill="#3f51b5" text-anchor="middle" font-weight="bold">ANNONCES</text>
    
    <!-- People -->
    <!-- Person 1 -->
    <circle cx="30" cy="250" r="15" fill="#ff7043" />
    <rect x="25" y="265" width="10" height="30" fill="#ff7043" />
    <line x1="35" y1="275" x2="45" y2="265" stroke="#ff7043" stroke-width="5" />
    <line x1="25" y1="275" x2="15" y2="265" stroke="#ff7043" stroke-width="5" />
    <line x1="30" y1="295" x2="20" y2="315" stroke="#ff7043" stroke-width="5" />
    <line x1="30" y1="295" x2="40" y2="315" stroke="#ff7043" stroke-width="5" />
    
    <!-- Person 2 -->
    <circle cx="400" cy="250" r="15" fill="#42a5f5" />
    <rect x="395" y="265" width="10" height="30" fill="#42a5f5" />
    <line x1="405" y1="275" x2="415" y2="265" stroke="#42a5f5" stroke-width="5" />
    <line x1="395" y1="275" x2="385" y2="265" stroke="#42a5f5" stroke-width="5" />
    <line x1="400" y1="295" x2="390" y2="315" stroke="#42a5f5" stroke-width="5" />
    <line x1="400" y1="295" x2="410" y2="315" stroke="#42a5f5" stroke-width="5" />
    
    <!-- Shopping items -->
    <rect x="360" y="200" width="30" height="20" fill="#ffb74d" stroke="#e65100" stroke-width="1" />
    <rect x="365" y="190" width="20" height="10" fill="#ffb74d" stroke="#e65100" stroke-width="1" />
  </g>
  
  <!-- Abstract decoration elements -->
  <circle cx="50" cy="50" r="30" fill="#3f51b5" opacity="0.1" />
  <circle cx="550" cy="350" r="40" fill="#3f51b5" opacity="0.1" />
  <circle cx="500" cy="100" r="25" fill="#ff7043" opacity="0.1" />
  <circle cx="100" cy="350" r="35" fill="#ff7043" opacity="0.1" />
</svg> 